<!doctype html>
<html lang="nb" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Randonee ruteplanlegger</title>
<meta name="description" content="Toppturer på ski i Romsdal – ruter i 3D, skredfare, vær og turrapporter.">
<meta name="theme-color" content="#0d0b16">
<link rel="preconnect" href="https://js.arcgis.com" crossorigin>
<link rel="preconnect" href="https://services1.arcgis.com" crossorigin>
<link rel="preconnect" href="https://services.geodataonline.no" crossorigin>
<link rel="preconnect" href="https://kart.nve.no" crossorigin>
<link rel="preconnect" href="https://api01.nve.no" crossorigin>
<!-- Kartmotoren lastes parallelt og blokkerer ikke panelet -->
<script src="https://js.arcgis.com/4.31/" async id="esri-js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%2300C8FF'/%3E%3Cstop offset='1' stop-color='%23FF3EDB'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M2 27 13 8l5 8 3-4 9 15z' fill='url(%23g)'/%3E%3C/svg%3E">
<script>
  /* Sett tema før første maling for å unngå blink */
  (function(){try{var t=localStorage.getItem("rr.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css" id="esri-theme" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/flyover.css">
<link rel="stylesheet" href="css/forhold.css">
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/turfinner.css">
</head>
<body>
<a class="skip" href="#left">Hopp til turlisten</a>

<div id="map" class="map" role="application" aria-label="Kart over toppturer i Romsdal"></div>

<!-- Liten skredfare-ring (mobil) -->
<div id="danger-mini" class="danger-mini" aria-live="polite"></div>

<!-- Venstrepanel / bunnark på mobil -->
<aside id="left" class="glass panel-left" aria-label="Turer og forhold" tabindex="-1">
  <div class="sheet-handle" id="sheet-handle" role="button" tabindex="0" aria-label="Endre høyde på panelet"><span></span></div>
  <header class="brand">
    <h1 class="brand__title">Randonee <span class="grad-text">ruteplanlegger</span></h1>
    <p class="brand__sub">Toppturer på ski i Romsdal</p>
  </header>
  <div id="search" class="search-host"></div>
  <div class="tabs" role="tablist" aria-label="Visning">
    <button class="tab" role="tab" id="tab-turer" aria-controls="pane-turer" aria-selected="true">Turer</button>
    <button class="tab" role="tab" id="tab-finner" aria-controls="pane-finner" aria-selected="false" tabindex="-1">Turfinner</button>
    <button class="tab" role="tab" id="tab-forhold" aria-controls="pane-forhold" aria-selected="false" tabindex="-1">Forhold</button>
  </div>
  <div class="panel-scroll">
    <section id="pane-turer" role="tabpanel" aria-labelledby="tab-turer">
      <div id="danger"></div>
      <div id="finn"></div>
      <div id="list"></div>
    </section>
    <section id="pane-finner" role="tabpanel" aria-labelledby="tab-finner" hidden>
      <div id="finner"></div>
    </section>
    <section id="pane-forhold" role="tabpanel" aria-labelledby="tab-forhold" hidden>
      <div id="forhold"></div>
    </section>
  </div>
</aside>

<!-- Høyrepanel: turkort -->
<aside id="right" class="glass panel-right" aria-label="Valgt tur" hidden>
  <div id="card"></div>
</aside>

<!-- Kartkontroller -->
<nav id="controls" class="controls" aria-label="Kartkontroller">
  <button id="btn-mode" class="ctl" type="button" aria-pressed="false" title="Bytt mellom 3D og 2D"><span class="ctl__txt">2D</span></button>
  <button id="btn-locate" class="ctl" type="button" title="Min posisjon" aria-label="Min posisjon"></button>
  <button id="btn-steep" class="ctl" type="button" aria-pressed="true" title="Bratthet av/på" aria-label="Bratthet"></button>
  <button id="btn-legend" class="ctl" type="button" aria-expanded="false" aria-controls="legend" title="Tegnforklaring" aria-label="Tegnforklaring"></button>
  <button id="btn-theme" class="ctl" type="button" title="Lys/mørk modus" aria-label="Bytt til lys modus"></button>
</nav>
<div id="legend" class="glass legend" hidden></div>

<!-- Fly over-kontroller -->
<div id="flybar" class="glass flybar" hidden></div>

<!-- Velkomst -->
<div id="welcome" class="welcome" hidden></div>

<div id="loader" class="loader" aria-hidden="true"><div class="loader__ring"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/mobile.js"></script>
<script src="js/panel.js"></script>
<script src="js/card.js"></script>
<script src="js/forhold.js"></script>
<script src="js/search.js"></script>
<script src="js/turfinner.js"></script>
<script src="js/scene.js"></script>
<script src="js/flyover.js"></script>
<script src="js/app.js"></script>
</body>
</html>
